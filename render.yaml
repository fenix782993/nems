services:
  - type: web
    name: nemazing-rp-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: CHANNEL_USERNAME
        value: "@nemazing"
      - key: DATABASE_URL
        sync: false
